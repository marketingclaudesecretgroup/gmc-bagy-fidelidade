services:
  - type: web
    name: gmc-bagy-fidelidade
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
